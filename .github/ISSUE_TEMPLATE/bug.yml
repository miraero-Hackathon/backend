name: "🐛 버그 수정"
description: "발생한 오류를 수정합니다."
title: "[BUG] "
labels:
  - "bug"
body:
  - type: textarea
    id: description
    attributes:
      label: "버그 설명"
      placeholder: "발생한 문제를 간단하게 설명해주세요."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "발생 과정"
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "에러 로그 및 참고 자료"
      placeholder: "에러 로그나 스크린샷을 첨부해주세요."
