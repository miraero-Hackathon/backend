name: "✨ Feature"
description: "새로운 기능을 개발합니다."
title: "[FEAT] "
labels:
  - "feature"

body:
  - type: textarea
    id: description
    attributes:
      label: "📄 설명"
      description: "새로운 기능에 대한 설명을 작성해 주세요."
      placeholder: "자세히 적을수록 좋습니다!"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업할 내용"
      description: "할 일을 체크박스 형태로 작성해주세요."
      placeholder: |
        - 작업 내용 1
        - 작업 내용 2
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "🧑🏻 참고 자료"
      description: "참고 자료가 있다면 작성해 주세요."
      placeholder: "관련 링크나 이미지를 첨부해 주세요."
