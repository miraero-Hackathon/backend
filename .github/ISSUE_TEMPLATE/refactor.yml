name: "♻️ 리팩터링"
description: "기능 변경 없이 코드 구조를 개선합니다."
title: "[REFACTOR] "
labels:
  - "refactor"

body:
  - type: textarea
    id: description
    attributes:
      label: "리팩터링 설명"
      placeholder: "개선하려는 코드와 이유를 간단하게 설명해주세요."
    validations:
      required: true

  - type: checkboxes
    id: tasks
    attributes:
      label: "작업 내용"
      description: "해당하는 작업을 선택해주세요."
      options:
        - label: "코드 가독성 향상"
        - label: "중복 코드 제거"
        - label: "책임 분리 및 구조 개선"
        - label: "성능 개선"
        - label: "기타"

  - type: textarea
    id: reference
    attributes:
      label: "참고 사항"
      placeholder: "관련 코드, 이슈 또는 참고할 내용이 있다면 작성해주세요."
